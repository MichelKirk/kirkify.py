<!DOCTYPE html>
<html lang="it" data-theme="dark" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kirkify Studio{% endblock %} - Automation Platform</title>
    <!-- Tailwind CSS & DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #0d1117; color: #e6edf3; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#0b0f17]">
    <!-- Navbar -->
    <header class="navbar bg-[#161b22] border-b border-[#30363d] px-4 md:px-8 sticky top-0 z-50">
        <div class="flex-1 gap-2">
            <a href="/" class="flex items-center gap-3 text-xl font-bold tracking-wide text-white hover:opacity-90 transition">
                <span class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-purple-500/30">
                    <i class="ph-bold ph-sparkle text-lg"></i>
                </span>
                <span>Kirkify<span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">.Studio</span></span>
            </a>
            <span class="badge badge-sm badge-outline border-purple-500 text-purple-400 ml-2 font-mono">v1.0 Automation</span>
        </div>

        <div class="flex-none gap-4">
            <nav class="flex items-center gap-1 sm:gap-2">
                <a href="/" class="btn btn-ghost btn-sm text-gray-300 hover:text-white {% if request.url.path == '/' %}bg-[#21262d] text-white{% endif %}">
                    <i class="ph-bold ph-squares-four text-base"></i> Dashboard
                </a>
                <a href="/queue" class="btn btn-ghost btn-sm text-gray-300 hover:text-white {% if request.url.path == '/queue' %}bg-[#21262d] text-white{% endif %}">
                    <i class="ph-bold ph-queue text-base"></i> Coda Instagram
                </a>
                <a href="/settings" class="btn btn-ghost btn-sm text-gray-300 hover:text-white {% if request.url.path == '/settings' %}bg-[#21262d] text-white{% endif %}">
                    <i class="ph-bold ph-gear text-base"></i> Impostazioni
                </a>
            </nav>

            <div class="divider divider-horizontal my-2 mx-1 border-[#30363d]"></div>

            <div class="flex items-center gap-3">
                <span class="text-xs text-gray-400 hidden md:inline">{{ admin_email }}</span>
                <a href="/logout" class="btn btn-ghost btn-sm btn-circle text-gray-400 hover:text-red-400 hover:bg-red-950/40" title="Disconnetti">
                    <i class="ph-bold ph-sign-out text-lg"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer items-center p-4 bg-[#161b22] border-t border-[#30363d] text-gray-400 text-xs justify-between">
        <div>
            <p>Kirkify Studio Automation Platform &copy; 2026. Built with FastAPI, yt-dlp & Docker Compose.</p>
        </div>
        <div class="flex gap-4">
            <span>Minimum 60 FPS • GFPGAN HD • Google Drive • Instagram Scheduler</span>
        </div>
    </footer>
</body>
</html>
