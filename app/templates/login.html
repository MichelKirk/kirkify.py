<!DOCTYPE html>
<html lang="it" data-theme="dark" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kirkify Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background-color: #0b0f17; color: #e6edf3; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-md bg-[#161b22] border border-[#30363d] shadow-2xl p-6 sm:p-8">
        <div class="text-center mb-6">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white shadow-xl shadow-purple-500/30 mb-3">
                <i class="ph-bold ph-sparkle text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Kirkify Studio</h1>
            <p class="text-sm text-gray-400 mt-1">Accedi al pannello di controllo automazione</p>
        </div>

        {% if error %}
        <div class="alert alert-error bg-red-950/60 border border-red-800 text-red-200 text-sm mb-4 rounded-xl py-2 px-3">
            <i class="ph-bold ph-warning-circle text-lg"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-4">
            <div class="form-control">
                <label class="label text-xs font-semibold uppercase tracking-wider text-gray-400">Email Admin (.env)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="ph-bold ph-envelope text-lg"></i>
                    </span>
                    <input type="email" name="email" required placeholder="admin@kirkify.local" class="input input-bordered w-full pl-10 bg-[#0d1117] border-[#30363d] text-white focus:border-purple-500 focus:outline-none" />
                </div>
            </div>

            <div class="form-control">
                <label class="label text-xs font-semibold uppercase tracking-wider text-gray-400">Password (.env)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="ph-bold ph-lock-key text-lg"></i>
                    </span>
                    <input type="password" name="password" required placeholder="••••••••••••" class="input input-bordered w-full pl-10 bg-[#0d1117] border-[#30363d] text-white focus:border-purple-500 focus:outline-none" />
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 border-none text-white font-medium mt-2 shadow-lg shadow-purple-600/20">
                Accedi al Pannello
            </button>
        </form>

        <div class="text-center mt-6 text-xs text-gray-500">
            Credenziali gestite tramite variabili d'ambiente <code class="text-gray-400 bg-[#0d1117] px-1.5 py-0.5 rounded border border-[#30363d]">.env</code>
        </div>
    </div>
</body>
</html>
