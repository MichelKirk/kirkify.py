version: '3.8'

services:
  kirkify-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kirkify-studio
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persistent SQLite database, sessions, uploads and processed files
      - ./data:/app/data
      # Reference face photos
      - ./kirks:/app/kirks
      # ONNX AI Models mounted directly from host to avoid copying hundreds of MBs in docker context
      - ./inswapper_128.onnx:/app/inswapper_128.onnx:ro
      - ./GFPGANv1.4.onnx:/app/GFPGANv1.4.onnx:ro
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    # Optional GPU support (uncomment deploy section below if using NVIDIA Container Toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

